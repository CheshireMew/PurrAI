[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "purrai"
version = "0.1.0"
description = "Telegram group verification and moderation with a Chinese admin console"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "aiogram>=3.20,<4",
  "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20,<1", "alembic>=1.14,<2", "tzdata>=2025.1",
  "pydantic-settings>=2.7,<3", "pillow>=11,<13", "authlib>=1.4,<2",
  "httpx>=0.28,<1", "certifi>=2026.10.19", "cryptography>=44", "aiohttp-socks>=0.10,<1", "pypinyin>=0.55,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[project.scripts]
purrai = "purrai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
purrai = ["assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

